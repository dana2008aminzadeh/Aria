org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# Chaquopy needs a build-machine Python matching the app Python version.
# It is auto-detected from PATH; set explicitly if several versions are installed:
# chaquopy.buildPython=/usr/bin/python3

# The build machine is small: keep the Kotlin daemon from competing for RAM.
kotlin.daemon.jvmargs=-Xmx512m
