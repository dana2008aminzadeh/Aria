name: Android CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Python test dependencies
        run: python3 -m pip install 'yt-dlp==2026.10.21' 'certifi==2026.10.23'

      - name: Test media engine
        run: PYTHONPATH=app/src/main/python python3 -m unittest discover -s app/src/test/python -v

      - name: Test, lint and assemble Android app
        run: |
          set +e
          ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain > gradle.log 2>&1
          status=$?
          cat gradle.log
          if [ "$status" -ne 0 ]; then
            {
              echo '### Gradle failure diagnostics'
              echo ''
              echo '```text'
              tail -n 220 gradle.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Checks annotations are accessible through the normal GitHub API even when
            # the separate log-archive host is unavailable to a maintainer's tool.
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('gradle.log').read_text(errors='replace').splitlines()
          needles = ('e: ', 'error:', 'FAILED', 'FAILURE', 'What went wrong',
                     'A problem occurred', 'Execution failed', 'Caused by:')
          matches = [i for i, line in enumerate(lines) if any(n in line for n in needles)]
          if matches:
              selected = sorted({j for i in matches for j in range(max(0, i - 2),
                                 min(len(lines), i + 7))})
              lines = [lines[j] for j in selected]
          else:
              lines = lines[-40:]
          text = '\n'.join(lines)[:3500]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + text)
          PY
          fi
          exit "$status"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
