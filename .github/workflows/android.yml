name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Python test dependencies
        run: python3 -m pip install 'yt-dlp==2026.10.21' 'certifi==2026.10.23'

      - name: Test media engine
        run: PYTHONPATH=app/src/main/python python3 -m unittest discover -s app/src/test/python -v

      - name: Test, lint and assemble Android app
        run: |
          set +e
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace > gradle.log 2>&1
          status=$?
          cat gradle.log
          if [ "$status" -ne 0 ]; then
            {
              echo '### Gradle failure diagnostics'
              echo ''
              echo '```text'
              tail -n 220 gradle.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
